name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate content (gate: 448/448)
        run: npm run content:validate

      - name: Concept coverage (informational)
        run: npm run content:concepts || true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint (informational)
        run: npm run lint || true
